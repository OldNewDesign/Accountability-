<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>2nd PLT Accountability</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one working column — status board on top, sections of soldier rows below, sticky tally strip */
:root{
  --bg:#ecede6; --surface:#f9f9f5; --sunk:#e3e5db; --ink:#1c2018; --muted:#5f6657; --line:#d2d5c7;
  --accent:#465a2a; --accent-ink:#f4f6ee;
  --present:#2d7a3c; --warn:#a86b12; --appt:#6a4cae; --leave:#2c64a1; --detail:#566270; --other:#8a5527;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12150f; --surface:#1a1e16; --sunk:#0e110b; --ink:#e6e9dd; --muted:#9aa18d; --line:#2d3327;
  --accent:#a3bd6c; --accent-ink:#141a0c;
  --present:#6fc27c; --warn:#e2a64b; --appt:#b39cf0; --leave:#7fb0e6; --detail:#a6b0bb; --other:#d9a46e;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12150f; --surface:#1a1e16; --sunk:#0e110b; --ink:#e6e9dd; --muted:#9aa18d; --line:#2d3327;
  --accent:#a3bd6c; --accent-ink:#141a0c;
  --present:#6fc27c; --warn:#e2a64b; --appt:#b39cf0; --leave:#7fb0e6; --detail:#a6b0bb; --other:#d9a46e;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 64px;display:flex;flex-direction:column;gap:18px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Header */
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-size:14px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,7vw,44px);line-height:1;margin:4px 0 0;letter-spacing:.02em;text-wrap:balance}
nav{display:flex;gap:4px;background:var(--sunk);border-radius:8px;padding:4px}
nav button{border:0;background:transparent;padding:7px 14px;border-radius:6px;font-family:var(--display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:15px;color:var(--muted)}
nav button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}

.notice{padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--muted)}
.notice.err{border-color:var(--warn);color:var(--warn)}

/* Formation chips */
.formbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;display:inline-flex;gap:8px;align-items:baseline}
.chip .num{font-size:12px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] .num{color:inherit;opacity:.8}
.chip.add{border-style:dashed;color:var(--muted)}
.newform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.newform input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 10px;min-width:0;flex:1 1 160px}

/* Tally strip */
.tally{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px}
.big{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.big div{padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.big div+div{border-left:1px solid var(--line)}
.big .lbl{font-family:var(--display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.big .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:28px;line-height:1.05}
.big .present .v{color:var(--present)}
.big .open .v{color:var(--warn)}
.big .open.zero .v{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:26px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--line)}
.pill b{font-family:var(--mono);font-weight:500}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}

.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
.meta{color:var(--muted);font-size:13px}

/* Sections & rows */
.section{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.sechead{display:flex;justify-content:space-between;align-items:baseline;padding:9px 14px;background:var(--sunk);border-bottom:1px solid var(--line)}
.sechead h2{margin:0;font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:17px}
.colhead,.row{display:grid;grid-template-columns:44px minmax(0,1.1fr) 150px minmax(0,1.5fr);gap:10px;align-items:center;padding:8px 14px}
.colhead{font-family:var(--display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--muted);padding-block:6px;border-bottom:1px solid var(--line)}
.row+.row{border-top:1px solid var(--line)}
.row .who{display:flex;gap:8px;align-items:baseline;min-width:0}
.rank{font-family:var(--mono);font-size:13px;color:var(--muted);width:3.4em;flex:none}
.lname{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.mark{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;padding:0}
.mark::after{content:"";width:14px;height:14px;border-radius:50%;background:transparent;transition:background .15s}
.mark[aria-pressed="true"]{border-color:var(--present)}
.mark[aria-pressed="true"]::after{background:var(--present)}
.row .stack{display:flex;flex-direction:column;gap:6px;min-width:0}
select.status{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg);font-weight:600}
select.status[data-s=""]{color:var(--warn);border-color:var(--warn);border-style:dashed}
select.status[data-s="present"]{color:var(--present)}
select.status[data-s="appt"]{color:var(--appt)}
select.status[data-s="pass"],select.status[data-s="leave"]{color:var(--leave)}
select.status[data-s="detail"]{color:var(--detail)}
select.status[data-s="late"]{color:var(--warn)}
select.status[data-s="other"]{color:var(--other)}
.row input{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg);min-width:0}
.row input.rmk{border-color:transparent;background:transparent;border-bottom:1px solid var(--line);border-radius:0}
.row input.rmk:focus{border-color:var(--line);background:var(--bg);border-radius:6px}
.ro select,.ro input,.ro .mark{pointer-events:none}

@media (max-width:640px){
  .colhead{display:none}
  .row{grid-template-columns:40px minmax(0,1fr) 128px;grid-template-areas:"mark who status" ". rmk rmk";row-gap:4px}
  .row .mark{grid-area:mark}.row .who{grid-area:who}.row .stack{grid-area:status}.row .rmk{grid-area:rmk}
  .big .v{font-size:24px}
}

/* Reports */
.reports{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
.daylist{display:flex;flex-direction:column;gap:6px}
.dayitem{display:flex;justify-content:space-between;gap:8px;align-items:baseline;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px}
.dayitem[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.dayitem .d{font-family:var(--display);font-weight:700;letter-spacing:.05em;font-size:17px}
.dayitem .s{font-size:12px;color:var(--muted)}
.report{display:flex;flex-direction:column;gap:14px;min-width:0}
.rephead{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.rephead .top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline}
.rephead h2{margin:0;font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.04em}
.badge{font-family:var(--display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:12px;padding:3px 8px;border-radius:4px;border:1px solid currentColor}
.badge.live{color:var(--present)} .badge.closed{color:var(--muted)}
.numbers{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:15px}
.numbers .num{text-align:right}
.reptable{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--muted)}
tr.sec td{background:var(--sunk);font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
td.st{font-weight:600;color:var(--c,var(--ink))}
tr:last-child td{border-bottom:0}
textarea.copy{width:100%;min-height:160px;font-family:var(--mono);font-size:13px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px}
@media (max-width:720px){.reports{grid-template-columns:minmax(0,1fr)}.daylist{flex-direction:row;overflow-x:auto;padding-bottom:4px}.dayitem{flex:none;flex-direction:column;gap:0}}

/* Roster editor */
.edsec{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 14px}
.edsec .sh{display:flex;gap:8px;align-items:center}
.edsec input{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg);min-width:0}
.edsec .sh input{font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;flex:1}
.edrow{display:grid;grid-template-columns:80px minmax(0,1fr) auto;gap:8px;align-items:center}
.x{border:1px solid var(--line);background:transparent;border-radius:6px;padding:5px 9px;color:var(--muted);font-size:13px}
.x.confirm{border-color:var(--warn);color:var(--warn)}
.unitline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.unitline input{border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:var(--surface);font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:18px;min-width:0;flex:0 1 200px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-weight:600;z-index:20}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" id="unitEyebrow">Accountability</div>
      <h1 id="todayH">—</h1>
    </div>
    <nav role="tablist">
      <button role="tab" id="tab-formation" aria-selected="true" data-view="formation">Formation</button>
      <button role="tab" id="tab-reports" aria-selected="false" data-view="reports">Reports</button>
      <button role="tab" id="tab-roster" aria-selected="false" data-view="roster">Roster</button>
    </nav>
  </header>

  <div id="notice" class="notice" hidden></div>

  <!-- FORMATION -->
  <section id="view-formation" style="display:flex;flex-direction:column;gap:14px">
    <div class="formbar" id="formbar"></div>
    <div class="newform" id="newform" hidden>
      <span class="meta">New formation:</span>
      <button class="btn" data-preset="Noon formation">Noon</button>
      <button class="btn" data-preset="PT formation">PT</button>
      <button class="btn" data-preset="COB formation">COB</button>
      <input id="nfName" placeholder="Other name, e.g. Range brief">
      <button class="btn primary" id="nfCreate">Create</button>
      <button class="btn" id="nfCancel">Cancel</button>
    </div>
    <div class="tally">
      <div class="big">
        <div><span class="lbl">Assigned</span><span class="v" id="tAssigned">0</span></div>
        <div class="present"><span class="lbl">Present</span><span class="v" id="tPresent">0</span></div>
        <div class="open" id="tOpenBox"><span class="lbl">Unaccounted</span><span class="v" id="tOpen">0</span></div>
      </div>
      <div class="chips" id="tChips"></div>
    </div>
    <div class="actions">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn primary" id="allPresent">Mark remaining present</button>
        <button class="btn" id="carryBtn" hidden></button>
      </div>
      <span class="meta" id="saveState">Saves automatically · closes at 2359</span>
    </div>
    <div id="sections" style="display:flex;flex-direction:column;gap:14px"></div>
  </section>

  <!-- REPORTS -->
  <section id="view-reports" hidden>
    <div class="reports">
      <div class="daylist" id="daylist"></div>
      <div class="report" id="report"></div>
    </div>
  </section>

  <!-- ROSTER -->
  <section id="view-roster" hidden style="flex-direction:column;gap:14px">
    <div class="unitline">
      <span class="meta">Unit name</span>
      <input id="unitName" aria-label="Unit name">
      <span style="flex:1"></span>
      <button class="btn" id="addSection">Add section</button>
      <button class="btn primary" id="saveRoster" disabled>Save roster</button>
    </div>
    <p class="meta" style="margin:0">Changes apply from today forward. Past reports keep the roster they were taken with.</p>
    <div id="editor" style="display:flex;flex-direction:column;gap:12px"></div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const STATUSES=[
  ["","— Not accounted"],["present","Present"],["appt","Appt"],["pass","Pass"],["leave","Leave"],
  ["detail","Detail"],["late","Late"],["other","Other…"]];
const LABEL={present:"Present",appt:"Appt",pass:"Pass",leave:"Leave",detail:"Detail",late:"Late",other:"Other"};
const COLOR={present:"var(--present)",appt:"var(--appt)",pass:"var(--leave)",leave:"var(--leave)",detail:"var(--detail)",late:"var(--warn)",other:"var(--other)"};
const CARRY_DAY=["leave","pass","detail"];
const CARRY_FORM=["leave","pass","detail","appt","other"];
const MON=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const DOW=["SUN","MON","TUE","WED","THU","FRI","SAT"];

const $=s=>document.querySelector(s);
const el=(t,a={},...kids)=>{const e=document.createElement(t);for(const k in a){if(k==="class")e.className=a[k];else if(k==="text")e.textContent=a[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),a[k]);else e.setAttribute(k,a[k]);}kids.flat().forEach(c=>c!=null&&e.append(c));return e;};
const pad=n=>String(n).padStart(2,"0");
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const milDate=k=>{const [y,m,d]=k.split("-").map(Number);return `${pad(d)} ${MON[m-1]} ${y}`;};
const dowOf=k=>{const [y,m,d]=k.split("-").map(Number);return DOW[new Date(y,m-1,d).getDay()];};
const hhmm=iso=>{if(!iso)return"";const d=new Date(iso);return pad(d.getHours())+pad(d.getMinutes());};
const clone=o=>JSON.parse(JSON.stringify(o||null));
function merge(a,b){if(b===null||typeof b!=="object"||Array.isArray(b))return clone(b);const out=(a&&typeof a==="object"&&!Array.isArray(a))?clone(a):{};for(const k in b)out[k]=merge(out[k],b[k]);return out;}

let db=null, canWrite=true;
let roster=null;            // {unit, sections:[{name, soldiers:[{id,rank,name}]}]}
let today=keyOf(new Date());
let dayRemote=null, dayExists=false, pending=null, flushTimer=null, chain=Promise.resolve(), unsubDay=null;
let curForm=null;           // formation id being shown
let days=[];                // report list
let selDay=null, selForm=null;
let view="formation";

function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,1800);}
function notice(m,err){const n=$("#notice");n.hidden=!m;n.textContent=m||"";n.classList.toggle("err",!!err);}

/* ---------- day state ---------- */
const dayState=()=>merge(dayRemote||{},pending||{});
function formations(d){const f=(d&&d.formations)||{};return Object.keys(f).map(id=>({id,...f[id]})).sort((a,b)=>(a.startedAt||"").localeCompare(b.startedAt||""));}
function allSoldiers(r){return (r&&r.sections||[]).flatMap(s=>s.soldiers);}

function queue(patch,delay){
  if(!canWrite)return;
  const base={date:today,unit:roster.unit,roster:clone(roster),updatedAt:new Date().toISOString()};
  pending=merge(pending||{},merge(base,patch));
  // roster arrays must replace wholesale
  pending.roster=clone(roster);
  $("#saveState").textContent="Saving…";
  render();
  clearTimeout(flushTimer);flushTimer=setTimeout(flush,delay);
}
function flush(){
  const p=pending;pending=null;if(!p)return;
  chain=chain.then(async()=>{
    const ref=db.doc("days/"+p.date);
    if(!dayExists||p.date!==today){
      const snap=await ref.get();
      if(snap.exists){await ref.update(p);}else{await ref.set(p);}
      dayExists=true;
    }else{await ref.update(p);}
    $("#saveState").textContent="Saved "+hhmm(new Date().toISOString())+" · closes at 2359";
  }).catch(e=>{
    if(e&&e.code==="invalid_argument"){canWrite=false;applyWriteGate();notice("You can view this roster but not change it.");}
    else if(e&&e.code==="quota_exceeded"){notice("Storage is full. Old reports need to be removed before new ones can save.",true);}
    else{notice("Couldn't save the last change. Check your connection, then mark the soldier again.",true);}
    $("#saveState").textContent="Not saved";
  });
}

function subscribeDay(){
  if(unsubDay)unsubDay();
  dayRemote=null;dayExists=false;curForm=null;
  unsubDay=db.doc("days/"+today).onSnapshot(s=>{
    dayExists=s.exists;dayRemote=s.exists?s.data():null;render();
  },()=>notice("Lost the live connection. Reload the page.",true));
}

/* ---------- formation actions ---------- */
function activeForm(){
  const fs=formations(dayState());
  if(curForm&&fs.find(f=>f.id===curForm))return curForm;
  if(curForm==="morning"&&!fs.length)return "morning";
  curForm=fs.length?fs[fs.length-1].id:"morning";
  return curForm;
}
function formMeta(fid){
  const f=(dayState().formations||{})[fid];
  if(f)return {};
  return {label:fid==="morning"?"Morning formation":fid,startedAt:new Date().toISOString()};
}
function setEntry(sid,patch,delay=0){
  const fid=activeForm();
  queue({formations:{[fid]:{...formMeta(fid),entries:{[sid]:{...patch,at:new Date().toISOString()}}}}},delay);
}
function entriesOf(d,fid){return ((d.formations||{})[fid]||{}).entries||{};}

function createFormation(label){
  const d=dayState();const fs=formations(d);
  const fid="f"+Date.now().toString(36);
  const entries={};
  if(fs.length){
    const prev=entriesOf(d,fs[fs.length-1].id);
    for(const sid in prev){const e=prev[sid];if(CARRY_FORM.includes(e.s))entries[sid]={s:e.s,other:e.other||"",rmk:e.rmk||"",at:new Date().toISOString()};}
  }
  curForm=fid;
  queue({formations:{[fid]:{label,startedAt:new Date().toISOString(),entries}}},0);
  $("#newform").hidden=true;$("#nfName").value="";
  toast(label+" started");
}
function prevDay(){return days.find(d=>d.date<today)||null;}
function carryCandidates(){
  const p=prevDay();if(!p)return [];
  const fs=formations(p);if(!fs.length)return [];
  const ents=entriesOf(p,fs[fs.length-1].id);const ids=new Set(allSoldiers(roster).map(s=>s.id));
  return Object.keys(ents).filter(sid=>ids.has(sid)&&CARRY_DAY.includes(ents[sid].s)).map(sid=>[sid,ents[sid]]);
}

/* ---------- counting ---------- */
function tally(sold,ents){
  const c={assigned:sold.length,present:0,open:0,by:{}};
  for(const s of sold){
    const e=ents[s.id]||{};const st=e.s||"";
    if(!st){c.open++;continue;}
    if(st==="present"){c.present++;continue;}
    const name=st==="other"?((e.other||"").trim()||"Other"):LABEL[st];
    const k=st==="other"?"other:"+name.toLowerCase():st;
    (c.by[k]=c.by[k]||{name,st,n:0}).n++;
  }
  return c;
}
const ORDER=["appt","pass","leave","detail","late","other"];
const byList=c=>Object.values(c.by).sort((a,b)=>ORDER.indexOf(a.st)-ORDER.indexOf(b.st)||a.name.localeCompare(b.name));
const statusText=e=>!e||!e.s?"Not accounted":e.s==="other"?((e.other||"").trim()||"Other"):LABEL[e.s];

/* ---------- render: formation ---------- */
let builtKey="";
function buildRows(){
  const box=$("#sections");box.textContent="";
  if(!roster||!allSoldiers(roster).length){
    box.append(el("div",{class:"notice"},"No soldiers on the roster yet. Open the Roster tab to add your sections and soldiers."));return;
  }
  for(const sec of roster.sections){
    const s=el("div",{class:"section"});
    s.append(el("div",{class:"sechead"},el("h2",{text:sec.name}),el("span",{class:"meta num","data-seccount":sec.name})));
    s.append(el("div",{class:"colhead"},el("span",{text:""}),el("span",{text:"Rank / Last name"}),el("span",{text:"Status"}),el("span",{text:"Remarks"})));
    for(const p of sec.soldiers){
      const sel=el("select",{class:"status",id:"st-"+p.id,"aria-label":`Status for ${p.rank} ${p.name}`});
      STATUSES.forEach(([v,l])=>sel.append(el("option",{value:v,text:l})));
      const other=el("input",{class:"other",id:"ot-"+p.id,placeholder:"Type status","aria-label":`Other status for ${p.rank} ${p.name}`});other.hidden=true;
      const rmk=el("input",{class:"rmk",id:"rm-"+p.id,placeholder:"Remarks","aria-label":`Remarks for ${p.rank} ${p.name}`});
      const mark=el("button",{class:"mark","aria-pressed":"false","aria-label":`Mark ${p.rank} ${p.name} present`});
      mark.addEventListener("click",()=>setEntry(p.id,{s:"present",other:""}));
      sel.addEventListener("change",()=>{const v=sel.value;if(v==="other"){other.hidden=false;other.focus();}setEntry(p.id,{s:v,...(v!=="other"?{other:""}:{})});});
      other.addEventListener("input",()=>setEntry(p.id,{s:"other",other:other.value},700));
      rmk.addEventListener("input",()=>setEntry(p.id,{rmk:rmk.value},700));
      s.append(el("div",{class:"row","data-id":p.id},mark,el("div",{class:"who"},el("span",{class:"rank",text:p.rank}),el("span",{class:"lname",text:p.name})),el("div",{class:"stack"},sel,other),rmk));
    }
    box.append(s);
  }
}
function renderFormation(){
  const key=JSON.stringify(roster);
  if(key!==builtKey){builtKey=key;buildRows();}
  const d=dayState();const fs=formations(d);const fid=activeForm();
  // formation chips
  const bar=$("#formbar");bar.textContent="";
  const list=fs.length?fs:[{id:"morning",label:"Morning formation"}];
  if(!fs.find(f=>f.id===fid)&&fid!=="morning")list.push({id:fid,label:"New formation"});
  for(const f of list){
    const b=el("button",{class:"chip","aria-pressed":String(f.id===fid)},el("span",{text:f.label}),f.startedAt?el("span",{class:"num",text:hhmm(f.startedAt)}):null);
    b.addEventListener("click",()=>{curForm=f.id;render();});bar.append(b);
  }
  if(canWrite){const add=el("button",{class:"chip add",text:"+ Formation"});add.addEventListener("click",()=>{$("#newform").hidden=false;});bar.append(add);}
  // rows
  const ents=entriesOf(d,fid);const sold=allSoldiers(roster);
  for(const p of sold){
    const e=ents[p.id]||{};const st=e.s||"";
    const sel=document.getElementById("st-"+p.id);if(!sel)continue;
    if(document.activeElement!==sel)sel.value=st;sel.dataset.s=st;
    document.querySelector(`.row[data-id="${p.id}"] .mark`).setAttribute("aria-pressed",String(st==="present"));
    const ot=document.getElementById("ot-"+p.id);ot.hidden=st!=="other";if(document.activeElement!==ot)ot.value=e.other||"";
    const rm=document.getElementById("rm-"+p.id);if(document.activeElement!==rm)rm.value=e.rmk||"";
  }
  for(const sec of (roster?roster.sections:[])){
    const n=sec.soldiers.filter(p=>(ents[p.id]||{}).s==="present").length;
    const c=document.querySelector(`[data-seccount="${CSS.escape(sec.name)}"]`);if(c)c.textContent=`${n} / ${sec.soldiers.length} present`;
  }
  const c=tally(sold,ents);
  $("#tAssigned").textContent=c.assigned;$("#tPresent").textContent=c.present;$("#tOpen").textContent=c.open;
  $("#tOpenBox").classList.toggle("zero",c.open===0);
  const chips=$("#tChips");chips.textContent="";
  byList(c).forEach(b=>{const p=el("span",{class:"pill"},el("b",{text:b.n}),b.name);p.style.setProperty("--c",COLOR[b.st]);chips.append(p);});
  if(!byList(c).length)chips.append(el("span",{class:"meta",text:c.open?"Tap the circle to mark a soldier present, or pick a status.":"Everyone is present."}));
  $("#allPresent").disabled=!canWrite||c.open===0;
  // carry-over from yesterday: only on an untouched first formation
  const cb=$("#carryBtn");const cand=(!fs.length&&canWrite)?carryCandidates():[];
  cb.hidden=!cand.length;
  if(cand.length)cb.textContent=`Carry over Leave / Pass / Detail from ${milDate(prevDay().date)} (${cand.length})`;
}

/* ---------- render: reports ---------- */
function reportText(d,fid){
  const r=d.roster||roster;const ents=entriesOf(d,fid);const sold=allSoldiers(r);const c=tally(sold,ents);
  const f=(d.formations||{})[fid]||{};
  const lines=[`${d.unit||r.unit}`,`DATE: ${milDate(d.date)}`,`FORMATION: ${f.label||""}${f.startedAt?" ("+hhmm(f.startedAt)+")":""}`,"","Numbers:",`${c.assigned} - Assigned`,`${c.present} - Present`];
  byList(c).forEach(b=>lines.push(`${b.n} - ${b.name}`));
  if(c.open)lines.push(`${c.open} - Not accounted`);
  for(const sec of r.sections){
    lines.push("",sec.name);
    sec.soldiers.forEach((p,i)=>{const e=ents[p.id]||{};let s=`${i+1}. ${p.rank} ${p.name}`;if(e.s!=="present")s+=` - ${statusText(e).toUpperCase()}`;if(e.rmk)s+=` (${e.rmk})`;lines.push(s);});
  }
  return lines.join("\n");
}
function renderReports(){
  const list=$("#daylist");list.textContent="";
  const all=days.slice();
  if(!selDay)selDay=today;
  if(!all.length){$("#report").textContent="";$("#report").append(el("div",{class:"notice",text:"No reports yet. Each day's accountability is saved here automatically once the first soldier is marked."}));return;}
  for(const d of all){
    const fs=formations(d);const last=fs[fs.length-1];
    const c=last?tally(allSoldiers(d.roster),entriesOf(d,last.id)):null;
    const b=el("button",{class:"dayitem","aria-pressed":String(d.date===selDay)},
      el("span",{},el("span",{class:"d",text:milDate(d.date)}),el("br"),el("span",{class:"s",text:dowOf(d.date)+(d.date===today?" · today":"")})),
      c?el("span",{class:"num s",text:`${c.present}/${c.assigned}`}):null);
    b.addEventListener("click",()=>{selDay=d.date;selForm=null;renderReports();});
    list.append(b);
  }
  const d=all.find(x=>x.date===selDay)||all[0];selDay=d.date;
  const fs=formations(d);const box=$("#report");box.textContent="";
  if(!fs.length){box.append(el("div",{class:"notice",text:"No formation recorded for this day."}));return;}
  if(!selForm||!fs.find(f=>f.id===selForm))selForm=fs[fs.length-1].id;
  const r=d.roster||roster;const ents=entriesOf(d,selForm);const c=tally(allSoldiers(r),ents);
  const live=d.date===today;
  const head=el("div",{class:"rephead"});
  head.append(el("div",{class:"top"},el("div",{},el("div",{class:"eyebrow",text:(d.unit||"")+" · End of day report"}),el("h2",{text:`${dowOf(d.date)} ${milDate(d.date)}`})),
    el("span",{class:"badge "+(live?"live":"closed"),text:live?"Live · closes 2359":"Closed · saved"})));
  if(fs.length>1){const fb=el("div",{class:"formbar"});fs.forEach((f,i)=>{const b=el("button",{class:"chip","aria-pressed":String(f.id===selForm)},el("span",{text:f.label+(i===fs.length-1?" (final)":"")}),el("span",{class:"num",text:hhmm(f.startedAt)}));b.addEventListener("click",()=>{selForm=f.id;renderReports();});fb.append(b);});head.append(fb);}
  const nums=el("div",{class:"numbers"});
  const addN=(n,l,col)=>{const v=el("span",{class:"num",text:n});const t=el("span",{text:l});if(col)t.style.color=col;nums.append(v,t);};
  addN(c.assigned,"Assigned");addN(c.present,"Present","var(--present)");
  byList(c).forEach(b=>addN(b.n,b.name,COLOR[b.st]));
  if(c.open)addN(c.open,"Not accounted","var(--warn)");
  head.append(nums);box.append(head);
  const tb=el("table",{},el("thead",{},el("tr",{},el("th",{text:"Rank"}),el("th",{text:"Last name"}),el("th",{text:"Status"}),el("th",{text:"Remarks"}))));
  const body=el("tbody");
  for(const sec of r.sections){
    body.append(el("tr",{class:"sec"},el("td",{colspan:"4",text:`${sec.name} · ${sec.soldiers.filter(p=>(ents[p.id]||{}).s==="present").length}/${sec.soldiers.length}`})));
    for(const p of sec.soldiers){const e=ents[p.id]||{};const td=el("td",{class:"st",text:statusText(e)});td.style.setProperty("--c",e.s?COLOR[e.s]:"var(--warn)");
      body.append(el("tr",{},el("td",{class:"num",text:p.rank}),el("td",{text:p.name}),td,el("td",{text:e.rmk||""})));}
  }
  tb.append(body);box.append(el("div",{class:"reptable"},tb));
  const txt=el("textarea",{class:"copy",id:"repText",readonly:"","aria-label":"Report text"});txt.value=reportText(d,selForm);
  const copy=el("button",{class:"btn primary",text:"Copy report text"});
  copy.addEventListener("click",()=>{const done=()=>toast("Report copied");try{navigator.clipboard.writeText(txt.value).then(done,()=>{txt.select();toast("Text selected — copy it");});}catch(e){txt.select();toast("Text selected — copy it");}});
  box.append(el("div",{class:"actions"},el("span",{class:"meta",text:"Plain-text version for sending up the chain"}),copy),txt);
}

/* ---------- render: roster editor ---------- */
let draft=null, dirty=false;
function renderEditor(){
  if(!draft)draft=clone(roster)||{unit:"",sections:[]};
  $("#unitName").value=draft.unit||"";
  const ed=$("#editor");ed.textContent="";
  draft.sections.forEach((sec,si)=>{
    const box=el("div",{class:"edsec"});
    const name=el("input",{value:sec.name,"aria-label":"Section name",id:"sec-"+si});name.addEventListener("input",()=>{sec.name=name.value;markDirty();});
    box.append(el("div",{class:"sh"},name,rmBtn(()=>{draft.sections.splice(si,1);markDirty();renderEditor();},sec.soldiers.length?"Remove section":"Remove")));
    sec.soldiers.forEach((p,pi)=>{
      const rk=el("input",{value:p.rank,"aria-label":"Rank",id:"rk-"+p.id});rk.addEventListener("input",()=>{p.rank=rk.value.toUpperCase();markDirty();});
      const nm=el("input",{value:p.name,"aria-label":"Last name",id:"nm-"+p.id});nm.addEventListener("input",()=>{p.name=nm.value;markDirty();});
      box.append(el("div",{class:"edrow"},rk,nm,rmBtn(()=>{sec.soldiers.splice(pi,1);markDirty();renderEditor();},"Remove")));
    });
    const add=el("button",{class:"btn",text:"Add soldier"});
    add.addEventListener("click",()=>{const id="s"+Date.now().toString(36);sec.soldiers.push({id,rank:"PVT",name:""});markDirty();renderEditor();const n=document.getElementById("nm-"+id);n&&n.focus();});
    box.append(el("div",{},add));ed.append(box);
  });
}
function rmBtn(fn,label){const b=el("button",{class:"x",text:label});b.addEventListener("click",()=>{if(b.classList.contains("confirm"))fn();else{b.classList.add("confirm");b.textContent="Tap to confirm";setTimeout(()=>{b.classList.remove("confirm");b.textContent=label;},3000);}});return b;}
function markDirty(){dirty=true;$("#saveRoster").disabled=!canWrite;}

/* ---------- top level ---------- */
function applyWriteGate(){
  document.body.classList.toggle("ro",!canWrite);
  ["#allPresent","#saveRoster","#addSection"].forEach(s=>$(s).disabled=!canWrite||(s==="#saveRoster"&&!dirty));
  render();
}
function render(){
  $("#todayH").textContent=`${dowOf(today)} ${milDate(today)}`;
  $("#unitEyebrow").textContent=(roster&&roster.unit?roster.unit+" · ":"")+"Accountability";
  if(!roster)return;
  if(view==="formation")renderFormation();
  if(view==="reports")renderReports();
}
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>{
  view=b.dataset.view;
  document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected",String(x===b)));
  ["formation","reports","roster"].forEach(v=>{const s=$("#view-"+v);s.hidden=v!==view;if(v==="roster")s.style.display=v===view?"flex":"";});
  if(view==="roster"){draft=null;dirty=false;$("#saveRoster").disabled=true;renderEditor();}
  if(view==="reports")selDay=selDay||today;
  render();
}));

$("#allPresent").addEventListener("click",()=>{
  const fid=activeForm();const ents=entriesOf(dayState(),fid);const at=new Date().toISOString();const e={};
  allSoldiers(roster).forEach(p=>{if(!(ents[p.id]||{}).s)e[p.id]={s:"present",other:"",at};});
  queue({formations:{[fid]:{...formMeta(fid),entries:e}}},0);toast(Object.keys(e).length+" marked present");
});
$("#carryBtn").addEventListener("click",()=>{
  const fid=activeForm();const e={};const at=new Date().toISOString();
  carryCandidates().forEach(([sid,x])=>e[sid]={s:x.s,other:x.other||"",rmk:x.rmk||"",at});
  queue({formations:{[fid]:{...formMeta(fid),entries:e}}},0);toast("Carried over "+Object.keys(e).length);
});
document.querySelectorAll("[data-preset]").forEach(b=>b.addEventListener("click",()=>createFormation(b.dataset.preset)));
$("#nfCreate").addEventListener("click",()=>{const n=$("#nfName").value.trim();if(!n){$("#nfName").focus();return;}createFormation(n);});
$("#nfName").addEventListener("keydown",e=>{if(e.key==="Enter")$("#nfCreate").click();});
$("#nfCancel").addEventListener("click",()=>{$("#newform").hidden=true;});
$("#unitName").addEventListener("input",()=>{draft.unit=$("#unitName").value;markDirty();});
$("#addSection").addEventListener("click",()=>{draft.sections.push({name:"NEW SECTION",soldiers:[]});markDirty();renderEditor();});
$("#saveRoster").addEventListener("click",async()=>{
  const clean={unit:(draft.unit||"").trim()||"PLT",sections:draft.sections.map(s=>({name:s.name.trim()||"SECTION",soldiers:s.soldiers.filter(p=>p.name.trim()).map(p=>({id:p.id,rank:p.rank.trim(),name:p.name.trim()}))}))};
  $("#saveRoster").disabled=true;
  try{await db.doc("config/roster").set(clean);dirty=false;toast("Roster saved");draft=null;}
  catch(e){$("#saveRoster").disabled=false;notice(e&&e.code==="invalid_argument"?"You can view this roster but not change it.":"Couldn't save the roster. Check your connection and try again.",true);}
});

// day rollover: the finished day stays saved as its report; a fresh day starts at midnight
setInterval(()=>{const k=keyOf(new Date());if(k!==today&&db){if(pending)flush();today=k;selDay=null;subscribeDay();render();}},30000);

render();
(async()=>{
  db=window.claude&&window.claude.use?await window.claude.use("db"):null;
  if(!db){notice("Saving isn't available in this view. Open the roster from Claude to take accountability.",true);return;}
  const user=await window.claude.use("user");
  if(user){try{const c=await user.can("data.write");if(c===false)canWrite=false;}catch(e){}}
  db.doc("config/roster").onSnapshot(s=>{
    roster=s.exists?s.data():{unit:"",sections:[]};
    if(view==="roster"&&!dirty){draft=null;renderEditor();}
    render();
  },()=>notice("Lost the live connection. Reload the page.",true));
  db.collection("days").orderBy("date","desc").limit(120).onSnapshot(s=>{days=s.docs.map(x=>x.data());render();},()=>{});
  subscribeDay();
  applyWriteGate();
})();
})();
</script>
